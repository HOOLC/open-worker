[package]
name = "zork-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
qrcode = { version = "=0.14.1", default-features = false }
zork-client-types = { path = "../zork-client-types" }
gpui = { package = "gpui-unofficial", version = "=1.17.0-pre", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
unicode-segmentation = "1.12"
markdown = "1.0.0"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
js-sys = "0.3"

[features]
native-screenshots = ["gpui/test-support"]
stories = []
headless-bench = []
frame-profiler = ["gpui/profiler"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
