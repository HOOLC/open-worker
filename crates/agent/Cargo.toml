[package]
name = "zork-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zork_agent"
path = "src/lib.rs"

[[bin]]
name = "zork-agent"
path = "src/main.rs"

[dependencies]
aimux-core = "0.3.0"
aimux-provider-utils = "0.3.0"
aimux-providers = "0.3.0"
aimux-stream = "0.3.0"
anyhow = "1"
async-stream = "0.3.6"
async-trait = "0.1"
axum = "0.8.4"
base64 = "0.22"
fs2 = "0.4.3"
futures-util = "0.3.31"
jsonschema = { version = "0.49.7", default-features = false }
libc = "0.2.180"
percent-encoding = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.1.3"
url = "2.5.8"
zstd = "0.13.3"
zork-config = { path = "../zork-config" }
zork-profile = { path = "../profile" }

[dev-dependencies]
tempfile = "3"
