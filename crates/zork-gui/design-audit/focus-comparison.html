<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zork-gui focused Codex UI comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #ececec;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100vw; padding: 24px; }
      h1 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }
      h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
      .regions {
        display: grid;
        grid-template-columns: 560px minmax(0, 1fr);
        gap: 24px;
      }
      section {
        padding: 16px;
        border: 1px solid #d4d4d4;
        border-radius: 14px;
        background: white;
        box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
      }
      .pair { display: flex; align-items: flex-start; gap: 16px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin: 0 0 8px; color: #737373; font-size: 12px; }
      .sidebar img { display: block; width: auto; height: 690px; }
      .composer .pair { flex-direction: column; }
      .composer img { display: block; width: min(100%, 760px); height: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Focused fidelity — navigation and composer</h1>
      <div class="regions">
        <section class="sidebar">
          <h2>Task navigation</h2>
          <div class="pair">
            <figure>
              <figcaption>Source</figcaption>
              <img src="13-source-sidebar-focus.jpg" alt="Codex sidebar crop" />
            </figure>
            <figure>
              <figcaption>Implementation</figcaption>
              <img src="14-implementation-sidebar-focus.jpg" alt="zork-gui sidebar crop" />
            </figure>
          </div>
        </section>
        <section class="composer">
          <h2>Primary task composer</h2>
          <div class="pair">
            <figure>
              <figcaption>Source</figcaption>
              <img src="15-source-composer-focus.jpg" alt="Codex composer crop" />
            </figure>
            <figure>
              <figcaption>Implementation</figcaption>
              <img src="16-implementation-composer-focus.jpg" alt="zork-gui composer crop" />
            </figure>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
