<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zork-gui Codex composer comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #ececec;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100%; padding: 24px; }
      h1 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
        padding: 16px;
        overflow: hidden;
        border: 1px solid #d4d4d4;
        border-radius: 14px;
        background: white;
        box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
      }
      figcaption { margin-bottom: 14px; font-size: 13px; font-weight: 600; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex composer reference vs. zork-gui native implementation</h1>
      <section class="comparison">
        <figure>
          <figcaption>Source — live Codex on mini2 via CDP · 736 × 141</figcaption>
          <img src="33-codex-cdp-source-composer.png" alt="Live Codex composer" />
        </figure>
        <figure>
          <figcaption>Implementation — native zork-gui · 682 × 130 capture</figcaption>
          <img src="37-zork-cdp-corrected-composer.jpg" alt="zork-gui composer" />
        </figure>
      </section>
    </main>
  </body>
</html>
