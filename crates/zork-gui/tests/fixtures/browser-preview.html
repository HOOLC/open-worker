  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #24272b; background: #fff; }

  .eyebrow { margin: 0 0 12px; color: #737980; font-size: 11px; letter-spacing: .08em; }
  h1 { font-size: 26px; letter-spacing: -.04em; line-height: 1.4; margin: 0 0 16px; font-weight: 600; }
  h2 { font-size: 16px; margin: 32px 0 8px; font-weight: 600; }
  p { margin: 8px 0; }
  .lead { color: #646970; }
  .rule { margin: 28px 0; height: 1px; background: #ececeb; }

<p class="eyebrow">ZORK / 浏览器示例</p>
<h1>把网页内容带入对话</h1>
<p class="lead">一边查看资料，一边和助手讨论。页面与问题放在一起，便于来回核对。</p>
<div class="rule"></div>
<h2>从一段内容开始</h2>
<p id="sample-paragraph">找到需要讨论的段落后，点击工具栏中的「选择元素」，再点击页面里的文字。选中的内容会附到对话草稿，你可以补充问题后一起发送。</p>
<blockquote>例如：请根据这段说明，整理一份操作清单。</blockquote>
<h2>浏览器由你掌握</h2>
<ol>
  <li><strong>打开资料。</strong>在地址栏输入网址，可用多个标签页保留不同资料。</li>
  <li><strong>按需授权。</strong>开启「允许操作」后，当前对话的助手才能操作网页。</li>
  <li><strong>随时接管。</strong>在更多菜单中选择「接管操作」，即可在当前页面继续操作。</li>
</ol>
<footer>本地演示页面 · 用于浏览器界面与交互验收</footer>
</html>
