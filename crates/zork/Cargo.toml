[package]
name = "zork"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zork"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "net", "io-util", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zork-config = { path = "../zork-config" }
